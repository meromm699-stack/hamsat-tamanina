}

:root[data-palette="rose"]{--bg:#FCF3F2;--card:#FFFBFA;--fg:#5E4B50;--muted:#7D6A70;--accent:#A45B66;--soft:#F5DEDF;--line:#EBD3D5;--wash1:#F1CDD0;--wash2:#F7E6D6;--shadow:0 12px 32px rgba(94,75,80,.10)}
:root[data-palette="sky"]{--bg:#F3F8FA;--card:#FBFDFE;--fg:#4B5A66;--muted:#62758A;--accent:#46738F;--soft:#DEEBF2;--line:#D2E2EB;--wash1:#D2E5EF;--wash2:#F3E4E0;--shadow:0 12px 32px rgba(75,90,102,.10)}
:root[data-palette="lilac"]{--bg:#F8F4F9;--card:#FDFAFE;--fg:#594A62;--muted:#76668A;--accent:#8A5F94;--soft:#EBDDF0;--line:#E1D3E7;--wash1:#E4D3EC;--wash2:#F7E5DD;--shadow:0 12px 32px rgba(89,74,98,.10)}
:root[data-palette="dusk"]{--bg:#403744;--card:#4A4050;--fg:#F6ECE6;--muted:#CDBFC8;--accent:#E3B3A8;--on-accent:#3F3036;--soft:#57495B;--line:#66576A;--wash1:#5A4660;--wash2:#44505A;--shadow:0 12px 32px rgba(20,12,24,.35);color-scheme:dark}

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-weight:500;font-size:17px;line-height:1.85;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .6s ease,color .6s ease;overflow-x:hidden;position:relative;min-height:100vh}
body::before,body::after{content:"";position:fixed;z-index:0;width:min(90vw,520px);aspect-ratio:1;border-radius:50%;filter:blur(60px);opacity:.75;pointer-events:none}
body::before{top:-14vw;inset-inline-start:-18vw;background:radial-gradient(circle,var(--wash1),transparent 68%)}
body::after{bottom:-16vw;inset-inline-end:-18vw;background:radial-gradient(circle,var(--wash2),transparent 68%)}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}

header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:6px}
.topline{text-align:center;color:var(--accent);font-weight:700;font-size:17px;line-height:1.8;margin:0 0 2px;padding-top:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(38px,11vw,54px);line-height:1.3;color:var(--accent);text-wrap:balance}
.brand-en{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tagline{max-width:34ch;font-size:17px;text-wrap:balance}
.palettes{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px}
.palettes span{font-size:13px;color:#8E7F8A;font-weight:700}
[data-palette="dusk"] .palettes span{color:var(--muted)}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}

nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--soft);padding:6px;border-radius:999px}
nav button{border:0;background:transparent;padding:10px 2px;border-radius:999px;font-weight:700;font-size:15px;min-height:46px;color:var(--muted);transition:background .25s,color .25s}
nav button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}

section[hidden]{display:none!important}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px 20px;border:1px solid var(--line)}
.card h2{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--accent);margin-bottom:6px;line-height:1.5;text-wrap:balance}
.hint{color:var(--muted);font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;min-height:44px;transition:transform .2s,background .2s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
textarea,input[type=text]{width:100%;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-weight:500;padding:12px 16px;line-height:1.8}
textarea{min-height:110px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.9}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:12px 26px;font-weight:700;font-size:17px;min-height:48px;box-shadow:var(--shadow);transition:transform .2s;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--soft);color:var(--accent);box-shadow:none}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}

.reply{display:flex;flex-direction:column;gap:14px;animation:rise .7s ease both}
.reply .hug{font-family:var(--f-display);font-size:24px;line-height:1.8;color:var(--accent)}
.reply .end{font-weight:700;color:var(--accent);padding-top:12px;border-top:1px dashed var(--line);text-align:center}
.verse{font-family:var(--f-quran);font-size:26px;line-height:2.2;text-align:center;text-wrap:balance}
.frame{position:relative;border:2px solid var(--accent);border-radius:26px;padding:26px 18px 20px;background:var(--bg);box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 6.5px var(--line)}
.frame svg.fl{position:absolute;inset-inline-start:50%;top:-14px;transform:translateX(50%);width:30px;height:30px;background:var(--card);border-radius:50%}
.ref{text-align:center;color:var(--accent);font-weight:700;font-size:14px;margin-top:2px}
.meaning{margin-top:12px;font-size:16px;color:var(--fg);background:var(--soft);border-radius:20px;padding:12px 16px}
.alert{background:var(--soft);border:1.5px solid var(--accent);border-radius:22px;padding:16px 18px}
.alert b{color:var(--accent)}
.num{font-weight:700;font-size:22px;direction:ltr;unicode-bidi:isolate;user-select:all;letter-spacing:.08em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mini{border:1.5px solid var(--line);background:var(--card);border-radius:24px;padding:16px 14px;font-family:var(--f-quran);font-size:19px;line-height:2;text-align:center;min-width:0;transition:transform .2s,border-color .2s}
.mini:hover{transform:translateY(-2px);border-color:var(--accent)}

.tasbeeh{display:flex;flex-direction:column;align-items:center;gap:12px}
.ring{position:relative;width:min(70vw,250px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .25s ease}
.tap{position:absolute;inset:16%;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);transition:transform .12s}
.tap:active{transform:scale(.96)}
.tap strong{font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.tap span{font-size:15px}
.total{color:var(--muted);font-size:15px}

.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.name{background:var(--soft);border-radius:22px;padding:14px 16px;min-width:0}
.name b{font-family:var(--f-display);font-size:22px;color:var(--accent);display:block}

/* stories */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scard{text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:28px;padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .2s}
.scard:hover{transform:translateY(-3px)}
.scard b{font-family:var(--f-display);font-size:22px;color:var(--accent);line-height:1.6}
.scard small{color:var(--muted);font-size:14px}
.reader{display:flex;flex-direction:column;gap:16px;font-family:var(--f-story);font-size:18px;line-height:2.05}
.reader h2{font-size:30px}
.reader .quote{border-inline-start:4px solid var(--accent);background:var(--soft);border-radius:18px;padding:12px 16px;font-size:18px}
.reader .quote small{display:block;color:var(--accent);font-weight:700;font-size:14px;margin-top:4px}
.endbox{background:var(--soft);border-radius:24px;padding:16px 18px;text-align:center;font-family:var(--f-display);font-size:22px;color:var(--accent);line-height:1.9}
details.m{margin-top:10px}
details.m summary{cursor:pointer;color:var(--accent);font-weight:700;text-align:center;list-style:none;padding:6px}
details.m summary::-webkit-details-marker{display:none}
.hadith{border:1.5px solid var(--line);border-radius:24px;padding:16px 18px;background:var(--card);margin-top:12px}
.hadith .ht{font-family:var(--f-quran);font-size:22px;line-height:2.1}
.hadith .hs{color:var(--accent);font-weight:700;font-size:14px;margin-top:4px}
.hadithText{font-family:var(--f-quran);font-size:21px;line-height:2.1;text-align:center;text-wrap:balance}

/* gift */
.gift{display:flex;flex-direction:column;gap:14px}
.stick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stick button{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px;aspect-ratio:1;min-width:0;display:flex}
.stick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.stick img{width:100%;height:100%;object-fit:contain}
.cwrap{display:flex;justify-content:center}
#giftCanvas{width:min(100%,380px);aspect-ratio:4/5;height:auto;border-radius:24px;box-shadow:var(--shadow);background:var(--bg)}
.lab{font-weight:700;font-size:15px;color:var(--accent)}
select{width:100%;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;padding:12px 16px}

.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.face{border:1.5px solid var(--line);background:var(--card);border-radius:22px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.face svg{width:44px;height:44px;color:var(--accent)}
.face[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
footer{font-size:14px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;padding-top:8px}
footer .num{font-size:16px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){body{font-size:16px}.faces{gap:5px}.face{font-size:12px}.verse{font-size:23px}.reader{font-size:17px}nav button{font-size:14px}.stick{gap:6px}}
</style>
</head>

<body>
<div id="app" dir="rtl" lang="ar">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="flower" viewBox="0 0 30 30"><g fill="var(--accent)" opacity=".85"><circle cx="15" cy="7" r="4.4"/><circle cx="22.6" cy="12.5" r="4.4"/><circle cx="19.7" cy="21.4" r="4.4"/><circle cx="10.3" cy="21.4" r="4.4"/><circle cx="7.4" cy="12.5" r="4.4"/></g><circle cx="15" cy="15" r="3.6" fill="var(--card)"/></symbol>
  </svg>

  <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:4px;">
    <p class="topline" style="margin:0; padding-top:8px;">اللهم اجعل هذا العمل خالصا لوجهك الكريم</p>
    <span style="color:var(--accent); font-size:18px; line-height:1;">♥</span>
    <p class="topline" style="margin:0; padding:0;">الحمد لله الذي هدانا لهذا وما كنا لنهتدي لولا أن هدانا الله</p>
  </div>
  <header>
    <h1 class="brand">همسة طمأنينة</h1>
    <div class="brand-en">Hamsat Tamanina</div>
    <p class="tagline">مساحة آمنة تثبت قلبك وروحك 🕊️ ✨ أنا هنا جنبك، ونتكلم بالراحة لحد ما قلبك يطمن</p>
    <div class="palettes" role="group" aria-label="ألوان الموقع">
      <span>اختاري ألوانك</span>
      <button class="dot" data-p="cream" aria-pressed="true" aria-label="كريمي" style="background:#F5E6D3"></button>
      <button class="dot" data-p="sage" aria-pressed="false" aria-label="أخضر هادئ" style="background:#C9D9B8"></button>
      <button class="dot" data-p="rose" aria-pressed="false" aria-label="وردي ترابي" style="background:#CC8A92"></button>
      <button class="dot" data-p="sky" aria-pressed="false" aria-label="أزرق سماوي" style="background:#BCD6E4"></button>
      <button class="dot" data-p="lilac" aria-pressed="false" aria-label="ليلكي" style="background:#D9C5E3"></button>
      <button class="dot" data-p="dusk" aria-pressed="false" aria-label="مسائي" style="background:#5A4660"></button>
    </div>
  </header>

  <nav role="tablist" aria-label="الأقسام">
    <button role="tab" id="t-hamsa" data-tab="hamsa" aria-selected="true">همسة</button>
    <button role="tab" id="t-qesas" data-tab="qesas" aria-selected="false">قصص</button>
    <button role="tab" id="t-ward" data-tab="ward" aria-selected="false">ورد</button>
    <button role="tab" id="t-hadya" data-tab="hadya" aria-selected="false">هدية</button>
    <button role="tab" id="t-ana" data-tab="ana" aria-selected="false">أنا</button>
  </nav>

  <section class="panel" id="p-hamsa" role="tabpanel" aria-labelledby="t-hamsa">
    <div class="card">
      <h2>احكي لي.. حاسة بإيه دلوقتي؟</h2>
      <p class="hint">اختاري حالتك، أو اكتبي اللي في قلبك، وهتلاقي كلام يطمنك.</p>
      <div class="chips" id="chips"></div>
      <label for="story" class="hint">أو اكتبي بكلامك</label>
      <textarea id="story" placeholder="احكي لي.. حاسة بإيه دلوقتي؟"></textarea>
      <div class="row"><button class="btn" id="send">طمنيني</button></div>
    </div>
    <div class="card" id="replyCard" hidden aria-live="polite"></div>
  </section>

  <section class="panel" id="p-qesas" role="tabpanel" aria-labelledby="t-qesas" hidden>
    <div class="card" id="storiesHead">
      <h2>حكايات تثبّت القلب</h2>
      <p class="hint">قصص الأنبياء وصالحات من القرآن والسنة، بالآيات ومعناها، والأحاديث وشرحها، تُقرأ على مهل.</p>
    </div>
    <div class="stories" id="storyList"></div>
    <article class="card reader" id="reader" hidden></article>
  </section>

  <section class="panel" id="p-ward" role="tabpanel" aria-labelledby="t-ward" hidden>
    <div class="card">
      <h2>آية تطمنك دلوقتي</h2>
      <div class="frame" id="featured"><svg class="fl" aria-hidden="true"><use href="#flower"/></svg><p class="verse" id="featuredText"></p><p class="ref" id="featuredRef"></p></div>
      <p class="meaning" id="featuredMeaning"></p>
      <div class="row" style="justify-content:center"><button class="btn" id="newVerse">آية تطمنك دلوقتي</button></div>
    </div>
    <div class="card">
      <h2>حديث يطمنك</h2>
      <p class="hint">حديث واحد في كل مرة، مع شرح يفتح القلب.</p>
      <div class="frame"><p class="hadithText" id="hdText"></p><p class="ref" id="hdSrc"></p></div>
      <p class="meaning" id="hdMean"></p>
      <div class="row" style="justify-content:center"><button class="btn" id="newHadith">حديث تاني</button></div>
    </div>
    <div class="card">
      <h2>دعاء من القرآن</h2>
      <p class="hint">دعوات من القرآن الكريم، دعوة واحدة في كل مرة.</p>
      <div class="frame"><p class="verse" id="qdText"></p><p class="ref" id="qdRef"></p></div>
      <p class="meaning" id="qdMean"></p>
      <div class="row" style="justify-content:center"><button class="btn" id="newQDua">دعاء تاني</button></div>
    </div>
    <div class="card">
      <h2>أذكار</h2>
      <p class="hint">اختاري الوقت اللي إنتي فيه.</p>
      <div class="chips" id="adkChips" style="justify-content:center"></div>
      <div class="frame"><p class="hadithText" id="adkText"></p><p class="ref" id="adkRef"></p></div>
      <p class="meaning" id="adkMean"></p>
      <div class="row" style="justify-content:center;align-items:center"><span class="total" id="adkCount"></span><button class="btn" id="adkNext">الذكر اللي بعده</button></div>
    </div>
    <div class="card">
      <h2>سبحة</h2>
      <div class="chips" id="dhikrChips" style="justify-content:center"></div>
      <div class="tasbeeh">
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="8"/><circle class="fg" id="arc" cx="60" cy="60" r="54" fill="none" stroke-width="8" stroke-linecap="round"/></svg>
          <button class="tap" id="tap" aria-label="عدّ"><strong id="count">٠</strong><span id="dhikrName">سبحان الله</span></button>
        </div>
        <div class="total" id="total"></div>
        <button class="btn ghost" id="reset">ابدأي من جديد</button>
      </div>
    </div>
    <div class="card">
      <h2>لأنكِ الله</h2>
      <p class="hint">من أسماء الله الحسنى، بكلام بسيط يثبّت القلب.</p>
      <div class="names" id="names"></div>
      <div class="row" style="justify-content:center"><button class="btn" id="moreNames">أسماء أكتر</button></div>
    </div>
    <div class="card">
      <h2>كل الآيات</h2>
      <div class="grid" id="verseGrid"></div>
    </div>
  </section>

  <section class="panel" id="p-hadya" role="tabpanel" aria-labelledby="t-hadya" hidden>
    <div class="card gift">
      <h2>هدية همسة 🎁</h2>
      <p class="hint">اكتبي الاسم، واختاري الخلفية والاستيكر والعبارة، وهيطلع كارت جاهز تبعتيه.</p>
      <label class="lab" for="gName">الاسم</label>
      <input type="text" id="gName" maxlength="24" placeholder="مثلاً: مريم" autocomplete="off">
      <span class="lab">الخلفية</span>
      <div class="chips" id="themePick"></div>
      <span class="lab">الاستيكر</span>
      <div class="stick" id="stickPick"></div>
      <span class="lab">الخط</span>
      <div class="chips" id="fontPick"></div>
      <label class="lab" for="gPhrase">العبارة</label>
      <select id="gPhrase"></select>
      <label class="lab" for="gOwn">أو اكتبي عبارتك، وحطي {n} مكان الاسم</label>
      <input type="text" id="gOwn" maxlength="140" placeholder="مثلاً: يا {n}، ربنا معاكِ في كل خطوة" autocomplete="off">
      <div class="cwrap"><canvas id="giftCanvas" width="1080" height="1350" aria-label="معاينة الكارت"></canvas></div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="gSavePng">حمّلي PNG (أعلى جودة)</button>
        <button class="btn ghost" id="gSaveJpg">حمّلي JPG</button>
      </div>
      <p class="hint" id="gNote" style="text-align:center"></p>
    </div>
  </section>

  <section class="panel" id="p-ana" role="tabpanel" aria-labelledby="t-ana" hidden>
    <div class="card">
      <h2>عاملة إيه دلوقتي؟</h2>
      <p class="hint">اختاري الوش اللي يشبه إحساسك.</p>
      <div class="faces" id="faces"></div>
      <div id="faceReply" aria-live="polite" style="margin-top:14px"></div>
    </div>
  </section>

  <footer>
    <p>الردود هنا مكتوبة مسبقاً بحب، مش محادثة مع شخص.</p>
    <p>الخط الساخن للصحة النفسية: <span class="num">16328</span> (مجاني، على مدار الساعة).</p>
    <p>همسة طمأنينة | Hamsat Tamanina 🤍</p>
    <p class="visits">عدد الزوار: <img src="https://hamsat-tamanina.goatcounter.com/counter/TOTAL.svg" alt="عدد الزوار" style="height:22px;vertical-align:middle"></p>
  </footer>
</div>

<script>
/* ===== آيات (النصوص من Quran.com، رواية حفص، بالتشكيل) ===== */
var V={
v1328:{t:"الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",r:"سورة الرعد ٢٨",m:"ذكر الله يملأ القلب سكينة. فالطمأنينة الحقيقية ليست في كثرة ما حولنا من أشياء، بل في صلة القلب بخالقه، وكل قلب تعب يجد عنده راحته."},
v1597:{t:"وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَ",r:"سورة الحجر ٩٧",m:"ربنا يعلم أن صدر نبيّه ﷺ ضاق من كلام الناس، فلم يتركه وحده مع ضيقه. والآية التي بعدها مباشرة جاءت بالدواء: التسبيح والسجود. فالله يرى الضيق ويعرف سببه."},
v2187:{t:"لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",r:"سورة الأنبياء ٨٧",m:"دعاء يونس عليه السلام في ظلمات ثلاث: ظلمة الليل وظلمة البحر وظلمة بطن الحوت. فيه توحيد وتنزيه واعتراف، وكانت نتيجته النجاة من الغم، ووعد الله أن يكون ذلك لكل مؤمن."},
v1964:{t:"وَمَا كَانَ رَبُّكَ نَسِيًّا",r:"سورة مريم ٦٤",m:"ربنا لا ينسى أحدًا. إذا تأخر شيء فليس هذا نسيانًا، فكل شيء عنده بميزان وموعد، وعلمه لا يغفل عن أحد."},
v945:{t:"فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا",r:"سورة الشرح ٥ - ٦",m:"قال الله «مع» ولم يقل «بعد». فاليسر يرافق الضيق من أول لحظة ويكبر داخله. وتكرار الجملة تثبيت للقلب ووعد مؤكد."},
v940:{t:"لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا",r:"سورة التوبة ٤٠",m:"قالها النبي ﷺ لصاحبه أبي بكر وهما في الغار والخطر قريب. هي معية خاصة بالحفظ والنصر، ولها وقع على القلب في كل موقف يشتد فيه الخوف."},
v7156:{t:"وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ",r:"سورة الأعراف ١٥٦",m:"لا يوجد شيء خارج رحمة الله. هي أوسع من الذنب وأوسع من الخوف وأوسع من كل ما يضيق به القلب."},
v756:{t:"إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ",r:"سورة الأعراف ٥٦",m:"رحمة الله قريبة، وليست بعيدة المنال. وكل من يحسن ويصلح ويحاول بقلب صادق تحيط به هذه الرحمة."},
v2286:{t:"لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا",r:"سورة البقرة ٢٨٦",m:"ربنا أعلم بطاقة كل نفس. كل ما يحمّله الله لعبده فهو قادر على حمله بإذنه، فهو سبحانه لا يضع على أحد فوق ما يطيق."},
v933:{t:"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ",r:"سورة الضحى ٣",m:"نزلت حين تأخر الوحي على النبي ﷺ أيامًا فحزن، فجاءه الجواب: ما تركك ربك وما كرهك. فأي تأخير لا يعني هجرًا ولا غضبًا."},
v935:{t:"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ",r:"سورة الضحى ٥",m:"وعد بعطاء من الله حتى يصل القلب إلى الرضا. ليس عطاء عادياً، بل عطاء يملأ صاحبه رضًا وسعادة."},
v1286:{t:"قَالَ إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ",r:"سورة يوسف ٨٦",m:"قالها يعقوب عليه السلام وهو يحمل حزنًا كبيرًا. الشكوى إلى الله لا تنافي الصبر الجميل، بل هي من أجمل صوره، فهو يشكو لمن يملك الفرج."},
v1287:{t:"وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ",r:"سورة يوسف ٨٧",m:"«الرَّوْح» هو الفرج والرحمة بعد الشدة. قالها يعقوب لأبنائه وهو لا يعرف كيف سيأتي الفرج، لكنه كان على يقين من أنه آتٍ."},
v12100:{t:"إِنَّ رَبِّي لَطِيفٌ لِّمَا يَشَاءُ ۚ إِنَّهُ هُوَ الْعَلِيمُ الْحَكِيمُ",r:"سورة يوسف ١٠٠",m:"اللطيف هو الذي يدبّر الأمور برفق وخفاء، فيوصل الخير من طرق لا يتوقعها أحد. قالها يوسف بعد سنوات البئر والسجن، وهي خلاصة رحلته كلها."},
v3953:{t:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ",r:"سورة الزمر ٥٣",m:"نداء من الله لعباده الذين أخطأوا: لا تفقدوا الأمل في رحمتي، فهي تسع الذنب مهما كبر. وبعدها بيّن سبحانه أنه يغفر الذنوب جميعاً لمن رجع إليه."},
v2186:{t:"وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ",r:"سورة البقرة ١٨٦",m:"جاء الجواب هنا مباشرة من الله، دون أن يقول: قل. «فإني قريب». قرب بالسمع والعلم والإجابة، لا يحتاج إلى وسيط ولا إلى وقت معيّن."},
v2183:{t:"وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ",r:"سورة الأنبياء ٨٣",m:"دعاء أيوب عليه السلام في بلائه. لم يسأل صراحة، بل عرض حاله وأثنى على ربه بأنه أرحم الراحمين. وهذا أدب عظيم في الدعاء."},
v3844:{t:"إِنَّا وَجَدْنَاهُ صَابِرًا ۚ نِّعْمَ الْعَبْدُ ۖ إِنَّهُ أَوَّابٌ",r:"سورة ص ٤٤",m:"شهادة من الله لأيوب بالصبر وبأنه «أوّاب»، أي كثير الرجوع إلى ربه. هكذا يرى الله من صبر عليه: نعم العبد."},
v287:{t:"وَأَوْحَيْنَا إِلَىٰ أُمِّ مُوسَىٰ أَنْ أَرْضِعِيهِ ۖ فَإِذَا خِفْتِ عَلَيْهِ فَأَلْقِيهِ فِي الْيَمِّ وَلَا تَخَافِي وَلَا تَحْزَنِي ۖ إِنَّا رَادُّوهُ إِلَيْكِ وَجَاعِلُوهُ مِنَ الْمُرْسَلِينَ",r:"سورة القصص ٧",m:"وحي من الله لأم موسى فيه أمر ثم وعد: أمر بما يبدو مخيفاً، ثم وعد بأن الابن سيعود إليها وسيكون رسولاً. فجمع لها الله الأمان والبشارة في آية واحدة."},
v2813:{t:"فَرَدَدْنَاهُ إِلَىٰ أُمِّهِ كَيْ تَقَرَّ عَيْنُهَا وَلَا تَحْزَنَ",r:"سورة القصص ١٣",m:"أعاد الله موسى إلى أمه ليطمئن قلبها ولا تحزن. وعد الله لا يتخلف، وإن بدت الطريق إليه طويلة أو صعبة."},
v2039:{t:"وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةً مِّنِّي وَلِتُصْنَعَ عَلَىٰ عَيْنِي",r:"سورة طه ٣٩",m:"قال الله لموسى: جعلت القلوب تحبك، وربيتك تحت عنايتي ورعايتي. فالله كان يرعاه وهو لا يعلم."},
v2046:{t:"قَالَ لَا تَخَافَا ۖ إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ",r:"سورة طه ٤٦",m:"قالها الله لموسى وهارون حين خافا من مواجهة فرعون. معيّة فيها سمع ورؤية، فلا شيء يخفى عليه ولا صوت يغيب عنه."},
v2824:{t:"فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰ إِلَى الظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",r:"سورة القصص ٢٤",m:"دعاء موسى وهو غريب لا يملك شيئًا. لم يطلب شيئًا بعينه، بل أظهر حاجته وترك اختيار العطاء لربه. وبعدها مباشرة جاءه الفرج."},
v6611:{t:"وَضَرَبَ اللَّهُ مَثَلًا لِّلَّذِينَ آمَنُوا امْرَأَتَ فِرْعَوْنَ إِذْ قَالَتْ رَبِّ ابْنِ لِي عِندَكَ بَيْتًا فِي الْجَنَّةِ وَنَجِّنِي مِن فِرْعَوْنَ وَعَمَلِهِ وَنَجِّنِي مِنَ الْقَوْمِ الظَّالِمِينَ",r:"سورة التحريم ١١",m:"جعل الله امرأة فرعون مثلاً لكل مؤمن. قالت «عندك بيتًا» فقدّمت الجوار قبل الدار، وطلبت القرب من الله قبل أي شيء، ثم طلبت النجاة."},
v2169:{t:"قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ",r:"سورة الأنبياء ٦٩",m:"أمر من الله للنار فأطاعت. فكل شيء في الكون تحت أمره، وما يظنه الناس سببًا للهلاك يمكن أن يتحول بكلمة منه إلى برد وسلام."},
v653:{t:"وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ۚ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا",r:"سورة الطلاق ٣",m:"رزق يأتي من حيث لا تتوقع. ومن اعتمد على الله فهو كافيه. وأمر الله نافذ، ولكل شيء عنده مقدار وموعد لا يتقدم ولا يتأخر."},
v1924:{t:"فَنَادَاهَا مِن تَحْتِهَا أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا",r:"سورة مريم ٢٤",m:"في ذروة وجع مريم وخوفها جاءها نداء يطمئنها: لا تحزني، فقد جعل ربك تحتك جدول ماء. جاء الله لها بالسند والماء معًا."},
v1925:{t:"وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ تُسَاقِطْ عَلَيْكِ رُطَبًا جَنِيًّا",r:"سورة مريم ٢٥",m:"رزق قريب وطيّب جاء لمريم وهي في أضعف حالاتها. كأن الله يقول: أنا أعلم تعبك، وهذا غذاؤك ورزقك."},
v337:{t:"فَتَقَبَّلَهَا رَبُّهَا بِقَبُولٍ حَسَنٍ وَأَنبَتَهَا نَبَاتًا حَسَنًا",r:"سورة آل عمران ٣٧",m:"تقبل الله مريم تقبلاً حسناً ورعاها كما تُرعى النبتة الطيبة حتى كبرت. وهذا لطف من الله بعبد يبدأ طريقه إليه."},
v2152:{t:"فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ",r:"سورة البقرة ١٥٢",m:"وعد عظيم: إذا ذكرتِ الله ذكرك في الملأ الأعلى وفي قلب خلقه. وهو وعد من الله لا يعدله شيء."}
};

/* ===== أحاديث مع شرح ===== */
var H=[
{id:"h1",t:"عَجَبًا لِأَمْرِ الْمُؤْمِنِ، إِنَّ أَمْرَهُ كُلَّهُ خَيْرٌ، وَلَيْسَ ذَاكَ لِأَحَدٍ إِلَّا لِلْمُؤْمِنِ: إِنْ أَصَابَتْهُ سَرَّاءُ شَكَرَ فَكَانَ خَيْرًا لَهُ، وَإِنْ أَصَابَتْهُ ضَرَّاءُ صَبَرَ فَكَانَ خَيْرًا لَهُ",s:"رواه مسلم",m:"النبي ﷺ يتعجب من حال المؤمن، لأن أمره كله خير: إن جاءته نعمة شكر فكانت خيرًا له، وإن جاءه ضيق صبر فكان خيرًا له أيضًا. القلب المتعلق بالله رابح في كل حال، وكل ما يمر به يتحول إلى خير."},
{id:"h2",t:"مَا يُصِيبُ الْمُسْلِمَ مِنْ نَصَبٍ وَلَا وَصَبٍ وَلَا هَمٍّ وَلَا حُزْنٍ وَلَا أَذًى وَلَا غَمٍّ، حَتَّى الشَّوْكَةِ يُشَاكُهَا، إِلَّا كَفَّرَ اللَّهُ بِهَا مِنْ خَطَايَاهُ",s:"متفق عليه",m:"لا يصيب المسلم تعب ولا مرض ولا هم ولا حزن، ولا حتى وخزة شوكة، إلا كفّر الله به من خطاياه. فكل وجع في القلب أو في الجسد له أثر عند الله، ولا يضيع منه شيء."},
{id:"h3",t:"لَلَّهُ أَرْحَمُ بِعِبَادِهِ مِنْ هَذِهِ بِوَلَدِهَا",s:"متفق عليه",m:"رأى النبي ﷺ امرأة تبحث عن ولدها، فلما وجدته ضمّته إلى صدرها بحنان. فقال: «أترون هذه طارحة ولدها في النار؟» قالوا: لا والله. فقال: «لَلَّهُ أرحم بعباده من هذه بولدها». رحمة الله بعباده أعظم من أي حنان نعرفه."},
{id:"h4",t:"لَمَّا قَضَى اللَّهُ الْخَلْقَ كَتَبَ فِي كِتَابِهِ، فَهُوَ عِنْدَهُ فَوْقَ الْعَرْشِ: إِنَّ رَحْمَتِي تَغْلِبُ غَضَبِي",s:"رواه البخاري",m:"قبل أن يخلق الله الخلق كتب في كتابه عنده فوق العرش: إن رحمتي تغلب غضبي. فالرحمة هي الأصل في تعامل الله مع عباده، وبابها مفتوح دائمًا."},
{id:"h5",t:"يَقُولُ اللَّهُ تَعَالَى: أَنَا عِنْدَ ظَنِّ عَبْدِي بِي، وَأَنَا مَعَهُ إِذَا ذَكَرَنِي",s:"متفق عليه",m:"يقول الله: أنا عند ظن عبدي بي. فالله يعامل عبده على حسب ظنه به، ومن أحسن الظن بالله وجد خيره. وإذا ذكره العبد ذكره الله، وكان معه."},
{id:"h6",t:"الدُّعَاءُ هُوَ الْعِبَادَةُ",s:"رواه الترمذي وقال: حسن صحيح",m:"الدعاء روح العبادة، لأنه اعتراف بالحاجة إلى الله وإيمان بقدرته. وكل دعوة يرفعها القلب بصدق عبادة عظيمة، والله يسمعها."},
{id:"h7",t:"مَا مِنْ مُسْلِمٍ يَدْعُو بِدَعْوَةٍ لَيْسَ فِيهَا إِثْمٌ وَلَا قَطِيعَةُ رَحِمٍ، إِلَّا أَعْطَاهُ اللَّهُ بِهَا إِحْدَى ثَلَاثٍ: إِمَّا أَنْ تُعَجَّلَ لَهُ دَعْوَتُهُ، وَإِمَّا أَنْ يَدَّخِرَهَا لَهُ فِي الْآخِرَةِ، وَإِمَّا أَنْ يَصْرِفَ عَنْهُ مِنَ السُّوءِ مِثْلَهَا",s:"رواه أحمد",m:"لا يضيع دعاء صادق عند الله، فإما أن يُستجاب في وقته، وإما يُدَّخر ثوابه للعبد في الآخرة، وإما يُصرف عنه من الشر مثله. فكل دعوة لها أثر."},
{id:"h8",t:"احْفَظِ اللَّهَ يَحْفَظْكَ، احْفَظِ اللَّهَ تَجِدْهُ تُجَاهَكَ",s:"رواه الترمذي وقال: حسن صحيح",m:"من حفظ حدود الله وراعى علاقته به حفظه الله في دينه ودنياه. وقوله «تجده تجاهك» أي تجد عونه وحفظه أمامك في كل موقف، كأن الله يسير معك خطوة بخطوة."},
{id:"h9",t:"لَلَّهُ أَشَدُّ فَرَحًا بِتَوْبَةِ عَبْدِهِ حِينَ يَتُوبُ إِلَيْهِ، مِنْ أَحَدِكُمْ كَانَ عَلَى رَاحِلَتِهِ بِأَرْضِ فَلَاةٍ، فَانْفَلَتَتْ مِنْهُ وَعَلَيْهَا طَعَامُهُ وَشَرَابُهُ، فَأَيِسَ مِنْهَا، فَأَتَى شَجَرَةً فَاضْطَجَعَ فِي ظِلِّهَا، فَبَيْنَمَا هُوَ كَذَلِكَ إِذَا هُوَ بِهَا قَائِمَةً عِنْدَهُ، فَأَخَذَ بِخِطَامِهَا، ثُمَّ قَالَ مِنْ شِدَّةِ الْفَرَحِ: اللَّهُمَّ أَنْتَ عَبْدِي وَأَنَا رَبُّكَ، أَخْطَأَ مِنْ شِدَّةِ الْفَرَحِ",s:"رواه مسلم",m:"صوّر النبي ﷺ رجلًا ضاعت منه راحلته وفيها طعامه وشرابه، ويئس منها، ثم وجدها واقفة بجواره، فكانت فرحته لا توصف. وهكذا يفرح الله بعودة عبده إليه؛ مهما ابتعد القلب، فباب العودة مفتوح، والله يفرح بك حين تعود."},
{id:"h10",t:"إِنَّ اللَّهَ لَا يَنْظُرُ إِلَى صُوَرِكُمْ وَأَمْوَالِكُمْ، وَلَكِنْ يَنْظُرُ إِلَى قُلُوبِكُمْ وَأَعْمَالِكُمْ",s:"رواه مسلم",m:"مقام الإنسان عند الله لا يُقاس بشكله ولا بماله ولا بمنظره أمام الناس، بل بقلبه ونيته وعمله. وهذا ميزان يريح كل قلب أتعبته المقارنات، فقيمتك عند الله بصدق قلبك."},
{id:"h11",t:"مَنْ قَالَ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ فِي يَوْمٍ مِائَةَ مَرَّةٍ حُطَّتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ الْبَحْرِ",s:"متفق عليه",m:"كلمة خفيفة على اللسان، من قالها مائة مرة في اليوم حُطّت عنه خطاياه ولو كانت مثل زبد البحر. فما أكرم الله في الأجر على القليل!"},
{id:"h12",t:"كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ، ثَقِيلَتَانِ فِي الْمِيزَانِ، حَبِيبَتَانِ إِلَى الرَّحْمَنِ: سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، سُبْحَانَ اللَّهِ الْعَظِيمِ",s:"متفق عليه",m:"كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن. فأصغر الأعمال قد تكون أثقلها عند الله، وأحبها إليه."},
{id:"h13",t:"كَمُلَ مِنَ الرِّجَالِ كَثِيرٌ، وَلَمْ يَكْمُلْ مِنَ النِّسَاءِ إِلَّا مَرْيَمُ بِنْتُ عِمْرَانَ وَآسِيَةُ امْرَأَةُ فِرْعَوْنَ",s:"رواه البخاري (وهو جزء من حديث)",m:"شهد النبي ﷺ لمريم بنت عمران وآسية امرأة فرعون بالكمال في الإيمان. إحداهما صبرت على كلام الناس وظنونهم، والأخرى ثبتت على الإيمان في قصر الطغيان، وكلتاهما وجدتا ربهما أقرب من كل ما حولهما."},
{id:"h14",t:"هَذِهِ خَدِيجَةُ قَدْ أَتَتْكَ، فَاقْرَأْ عَلَيْهَا السَّلَامَ مِنْ رَبِّهَا وَمِنِّي، وَبَشِّرْهَا بِبَيْتٍ فِي الْجَنَّةِ مِنْ قَصَبٍ لَا صَخَبَ فِيهِ وَلَا نَصَبَ",s:"رواه البخاري (قاله جبريل للنبي ﷺ)",m:"قال جبريل للنبي ﷺ عن خديجة رضي الله عنها: «اقرأ عليها السلام من ربها ومني، وبشّرها ببيت في الجنة من قصب لا صخب فيه ولا نصب». بيت لا ضجيج فيه ولا تعب، وتكريم خاص لامرأة ثبّتت قلب النبي في أصعب لحظة."}
];

/* ===== أسماء الله ===== */
var N=[
{n:"الجبّار",m:"من أسمائه «الجبّار»، وهو الذي يجبر القلب المكسور، ويجبر الكسر في الجسد والحال والنفس. لن ينكسر قلبك بعيدًا عنه، فهو أقرب من يجبر ما انكسر، ويعيد إليكِ الأمل بعد كل وجع، ويعوّضكِ عما فات بما هو أحسن."},
{n:"اللطيف",m:"«اللطيف» هو الخبير بدقائق الأمور، والذي يوصل الرفق والخير لعباده بطرق خفية لا تخطر على البال. كم من باب انفتح لكِ من حيث لم تحتسبي، وكم من ضيق انفرج بلطف لم تنتبهي له. ألطافه تصلكِ وأنتِ لا تشعرين، فاطمئني."},
{n:"الودود",m:"«الودود» هو المحب لعباده، ومعناه أيضًا أنه محبوب من أوليائه. حبه للمؤمنين لا يبعدهم عنه، بل يقرّبهم إليه ويفتح لهم الباب كلما اقتربوا. فلا تشعري أبدًا أنكِ وحدك، فالله يحبكِ ويريدكِ قريبة منه."},
{n:"الرحيم",m:"«الرحيم» صاحب الرحمة التي وسعت كل شيء، وكل لحظة تعيشينها في كنفها، من نَفَس تتنفسينه إلى أمان تنامين فيه. ورحمته لا تنقطع، فهي تسبق الضيق وتبقى بعده، وتحفظكِ حين لا يحفظكِ أحد."},
{n:"الشافي",m:"«الشافي» هو الذي بيده الشفاء، يشفي الجسد والقلب معًا. وقد علّمنا النبي ﷺ أن ندعو: «اشفِ أنتَ الشافي، لا شفاء إلا شفاؤك، شفاءً لا يغادر سقمًا». فكل تعب يمر بكِ يعلمه الله، وهو قادر أن يرفعه ويعوّض عنه بالراحة."},
{n:"الوكيل",m:"«الوكيل» هو الذي يُفوَّض إليه الأمر فيكفي ويتولى. وهذه الكلمة قالها إبراهيم عليه السلام حين أُلقي في النار: «حسبنا الله ونعم الوكيل»، فكانت النار بردًا وسلامًا. من فوّض أمره إلى الله كفاه، ولا يضيع من تركت أمره في يده."},
{n:"الصمد",m:"«الصمد» هو السيد الذي تتجه إليه القلوب والحاجات، ولا يحتاج هو إلى أحد. فكل حاجة مهما صغرت يمكن أن تعرضيها عليه، فهو الغني عن كل شيء، والذي يقصده الجميع ولا يخيب من قصده."},
{n:"القريب",m:"«القريب» قريب بعلمه وسمعه وإجابته، يسمع الهمس والدعاء الخفي، ولا يغيب عنه أحد. وكما ذكر في القرآن أنه قريب يجيب الدعاء، فلا تحتاجي لصوت عالٍ ولا لوسيط، فهو أقرب إليكِ من حبل الوريد."},
{n:"السميع",m:"«السميع» يسمع كل صوت، ويسمع أيضًا ما يدور في القلب قبل أن يخرج في كلمة. فلا حاجة لأن ترفعي صوتكِ، فهو يسمعكِ وأنتِ تفكرين، ويعلم ما وراء الكلمات، ويعلم ما لم تقولي."},
{n:"الغفور",m:"«الغفور» يستر الذنب ويمحوه، ولا يفضح عبده، ويفتح له باب الرجوع كلما طرقه. وفي القرآن: «لا تقنطوا من رحمة الله». فمهما ابتعد القلب، باب المغفرة مفتوح، والله يفرح بعودة عبده إليه."}
];

/* ===== أدعية من القرآن ===== */
var DUAS=[
{v:"v2183"},{v:"v2187"},{v:"v2824"},{v:"v6611"},
{own:true,t:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",r:"ثبت عن إبراهيم عليه السلام حين أُلقي في النار (رواه البخاري)",m:"كلمة تفويض واطمئنان. أي: الله كافينا، ونعم من يُوكَل إليه الأمر. قالها إبراهيم في أشد لحظة، فكانت النار بردًا وسلامًا."}
];

// ===== أذكار =====
var ADK=[
 {k:"الصباح",items:[{t:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",r:"رواه مسلم",c:"مرة واحدة",m:"بداية يوم جديد بيد الله، والملك له وحده. نبدأ يومنا بالحمد، ونطلب منه خير اليوم، ونحتمي به من كل شر."},{t:"اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ",r:"رواه الترمذي",c:"مرة واحدة",m:"كل صباح حياة جديدة هدية من الله، نعيشها بتوفيقه، ونرجع إليه في النهاية."},{t:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ ﷺ نَبِيًّا",r:"رواه أبو داود والترمذي",c:"٣ مرات",m:"رضا القلب بالله ربًّا، وبالإسلام دينًا، وبمحمد نبيًّا. وفي الحديث: من قالها ثلاثًا كان حقًّا على الله أن يرضيه يوم القيامة."},{t:"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ، وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",r:"رواه أبو داود",c:"٧ مرات",m:"الله وحده يكفيني، لا معبود بحق إلا هو، وعليه وحده أعتمد. ومن قالها كفاه الله ما أهمّه من أمر دنياه وآخرته."},{t:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ، وَهُوَ السَّمِيعُ الْعَلِيمُ",r:"رواه أبو داود والترمذي وابن ماجه",c:"٣ مرات",m:"باسم الله الذي لا يضر مع اسمه شيء؛ اسمه حماية وأمان لكل من لجأ إليه."},{t:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ",r:"رواه ابن ماجه",c:"مرة واحدة",m:"أجمل ما يتمناه القلب لنفسه وأحبابه: عفو يمحو الذنب، وعافية تحفظ الجسد والروح."}]},
 {k:"المساء",items:[{t:"أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ",r:"رواه مسلم",c:"مرة واحدة",m:"ختام يوم بالحمد، والملك لله. نطلب منه أن يحفظ الليل وما بعده، ونطمئن أن الأمر كله بيده."},{t:"اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ الْمَصِيرُ",r:"رواه الترمذي",c:"مرة واحدة",m:"نعيش بالله، ونرجع إليه في النهاية. فالقلب يهدأ حين يعرف أن رجوعه إلى من يحبه."},{t:"اللَّهُمَّ إِنِّي أَمْسَيْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَٰهَ إِلَّا أَنْتَ، وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ",r:"رواه أبو داود",c:"٤ مرات",m:"أشهد الله وملائكته وخلقه على إيمانه بالله وحده، فيكون القلب في شهادة نور وطمأنينة."},{t:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",r:"رواه مسلم",c:"٣ مرات",m:"ألجأ إلى كلمات الله التامة التي لا يتجاوزها بر ولا فاجر، أحتمي بها من كل شر."},{t:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",r:"رواه مسلم",c:"١٠٠ مرة",m:"كلمة خفيفة على اللسان، ثقيلة في الميزان، تمحو الخطايا ولو كثرت."}]},
 {k:"النوم",items:[{t:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",r:"رواه البخاري",c:"مرة واحدة",m:"أنام وأستودع روحي عند الله، فمن يحفظ الحياة يحفظ النوم، وأستيقظ على رحمته."},{t:"اللَّهُمَّ أَسْلَمْتُ نَفْسِي إِلَيْكَ، وَفَوَّضْتُ أَمْرِي إِلَيْكَ، وَوَجَّهْتُ وَجْهِي إِلَيْكَ، وَأَلْجَأْتُ ظَهْرِي إِلَيْكَ، رَغْبَةً وَرَهْبَةً إِلَيْكَ، لَا مَلْجَأَ وَلَا مَنْجَى مِنْكَ إِلَّا إِلَيْكَ، آمَنْتُ بِكِتَابِكَ الَّذِي أَنْزَلْتَ، وَنَبِيِّكَ الَّذِي أَرْسَلْتَ",r:"متفق عليه",c:"مرة واحدة",m:"تسليم كامل لله قبل النوم، فالأمر كله في يده، والقلب يرتاح حين يترك حمله عند من يحمله بحق."},{t:"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ",r:"رواه أبو داود والترمذي",c:"٣ مرات",m:"دعاء بالوقاية والنجاة في يوم يجمع الله فيه عباده."},{t:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",r:"رواه البخاري (من حديث أبي هريرة)",c:"مرة واحدة",m:"آية الكرسي، سيدة آيات القرآن كما جاء في الحديث. فيها عظمة الله وحفظه، فينام القلب في حراسة الحي القيوم."},{t:"قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",r:"رواه البخاري",c:"٣ مرات",m:"سورة الإخلاص، تعدل ثلث القرآن كما جاء في الحديث. فيها توحيد الله الذي لا يُشبهه شيء."},{t:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ ۝ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",r:"رواه البخاري",c:"٣ مرات",m:"لجوء إلى رب الفجر والنور، يحفظ من كل ضر ويبعد الظلمة عن القلب."},{t:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ",r:"رواه البخاري",c:"٣ مرات",m:"لجوء إلى رب الناس وملكهم وإلههم، فيسكن القلب ويطمئن من كل وسوسة."},{t:"سُبْحَانَ اللَّهِ",r:"متفق عليه",c:"٣٣ مرة",m:"تنزيه الله عن كل نقص، وذكر يملأ القلب سكينة قبل النوم."},{t:"الْحَمْدُ لِلَّهِ",r:"متفق عليه",c:"٣٣ مرة",m:"شكر على نعم الله التي لا تُعد، فيختم اليوم بالامتنان."},{t:"اللَّهُ أَكْبَرُ",r:"متفق عليه",c:"٣٤ مرة",m:"الله أكبر من كل همّ وكل خوف، فيغمض القلب عينيه مطمئنًا."}]},
 {k:"دعاء الهم",items:[{t:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُخْلِ وَالْجُبْنِ، وَضَلَعِ الدَّيْنِ، وَغَلَبَةِ الرِّجَالِ",r:"رواه البخاري",c:"مرة واحدة",m:"دعاء يلجأ فيه القلب إلى الله من ثقل الهم والحزن، ويطلب القوة والراحة والفرج."},{t:"لَا إِلَٰهَ إِلَّا اللَّهُ الْعَظِيمُ الْحَلِيمُ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لَا إِلَٰهَ إِلَّا اللَّهُ رَبُّ السَّمَاوَاتِ وَرَبُّ الْأَرْضِ وَرَبُّ الْعَرْشِ الْكَرِيمِ",r:"متفق عليه",c:"مرة واحدة",m:"عند الكرب يتذكر القلب عظمة الله وحلمه ورحمته، ورب العرش الكريم فيخفّ الضيق."},{t:"اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَٰهَ إِلَّا أَنْتَ",r:"رواه أبو داود",c:"مرة واحدة",m:"رحمة الله هي الرجاء، فلا يتركنا لأنفسنا ولا لحظة، ويصلح الحال كله."}]}
];

/* ===== القصص: نص عادي = فقرة، {v:مفتاح آية}، {h:نص حديث، s:مصدر} ===== */
var S=[
{id:"yusuf",title:"يوسف.. وربي لطيف لما يشاء",sub:"قصة اللطف الخفي",min:6,body:[
"بدأت الحكاية بحلم صغير. رأى يوسف عليه السلام وهو طفل أحد عشر كوكبًا والشمس والقمر ساجدين له، فحكى الحلم لأبيه يعقوب. عرف الأب أن لابنه شأنًا عظيمًا، وخاف عليه من حسد إخوته، فطلب منه ألا يحكي لهم.",
"ومع ذلك دخلت الغيرة قلوب الإخوة. أخذوه في نزهة وألقوه في قاع بئر، ثم رجعوا إلى أبيهم بقميص عليه دم كاذب. وفي الظلام والوحدة في قاع البئر، أوحى الله إلى يوسف أنه سيخبرهم بما فعلوا يومًا وهم لا يشعرون.",
"مرت قافلة، ونزل أحدهم دلوه ليستسقي فخرج يوسف. ثم بيع في مصر بثمن قليل، واشتراه رجل من كبار القوم وقال لامرأته: أكرمي مثواه. هكذا مكّن الله ليوسف في الأرض، من حيث لا يخطر على بال.",
"ثم جاءت الفتنة في بيت العزيز، فاستعصم يوسف وقال: معاذ الله، وفضّل السجن على المعصية. فدخل السجن سنين وهو بريء. لكن السجن لم يكن آخر الحكاية، ففيه التقى بفتيين وفسّر لهما رؤياهما، وكانت تلك أول خيوط الفرج.",
"وبعد سنوات رأى الملك رؤيا حيّرت من حوله، فتذكّر الساقي يوسف. جاء يوسف بتأويل أنقذ مصر من المجاعة، فقال الملك: ائتوني به، ثم جعله على خزائن الأرض.",
"وجاءت سنوات الجدب، وجاء إخوته يطلبون الطعام فعرفهم وهم له منكرون. وكان أبوه يعقوب قد ابيضت عيناه من الحزن، ومع ذلك لم ينقطع أمله. قال وهو يحمل ألمًا كبيرًا:",
{v:"v1286"},
"وقال لأبنائه:",
{v:"v1287"},
"ثم أُلقي قميص يوسف على وجه أبيه فارتدّ بصيرًا، واجتمع الشمل في مصر. ورفع يوسف أبويه على العرش، وقال: هذا تأويل رؤياي من قبل قد جعلها ربي حقًّا. ثم قال الكلمة التي تلخّص الرحلة كلها:",
{v:"v12100"},
"رحلة من البئر إلى العرش. وكل خطوة مؤلمة فيها كانت خطوة في طريق رسمه الله بلطف. لم يظهر هذا اللطف وقت الألم، لكنه كان يعمل في الخفاء طوال الوقت."
],end:"لطف الله قد لا يُرى في وقت الألم، لكنه يعمل في الخفاء."},

{id:"yunus",title:"يونس.. ونادى في الظلمات",sub:"قصة من نادى فسمعه ربه",min:5,body:[
"أرسل الله يونس عليه السلام إلى قومه في نينوى، فدعاهم زمنًا طويلًا. ولما طال الأمر خرج مغاضبًا من قومه قبل أن يأذن له ربه، وركب سفينة مشحونة بالركاب.",
"هاجت الأمواج واضطرب البحر، فاقترع الركاب فيما بينهم، فكان يونس هو من أصابته القرعة، فأُلقي في الماء فالتقمه الحوت.",
"وهناك، في ظلمة الليل وظلمة البحر وظلمة بطن الحوت، لم يجد يونس بابًا إلا باب ربه. وقد ذكر المفسرون أن هذه هي الظلمات الثلاث. فنادى بأصدق ما يكون:",
{v:"v2187"},
"فاستجاب الله له ونجّاه من الغم، وجعل هذه النجاة وعدًا لكل مؤمن يدعو بدعوته.",
"ثم ألقاه الحوت على الشاطئ وهو ضعيف مريض، فأنبت الله عليه شجرة من يقطين تظلّله وتطعمه. ثم أرسله ربه إلى مئة ألف أو يزيدون، فآمنوا جميعًا، فمتّعهم الله إلى حين.",
"الظلمة التي ظنها يونس نهاية، كانت المكان الذي سمعه فيه ربه. ومنها خرج إلى ظل شجرة ورحمة وقوم آمنوا."
],end:"من قلب الظلمة وصل نداؤه، ومن هناك خرج إلى الرحمة."},

{id:"ayyub",title:"أيوب.. نعم العبد",sub:"قصة الصبر الجميل",min:4,body:[
"أيوب عليه السلام نبي ابتلاه الله ببلاء شديد في جسده، وطال عليه الأمر حتى صار مثلًا يُضرب في الصبر. ومع كل ما مر به، لم ينصرف قلبه عن ربه.",
"وحين اشتدت الحال، لم يُكثر الشكوى للناس، بل رفع يديه بكلمات قليلة فيها أدب كبير:",
{v:"v2183"},
"لاحظي كيف دعا: لم يقل «اشفني» صراحة، بل عرض حاله وأثنى على ربه بأنه أرحم الراحمين، وترك الأمر له. فجاء الجواب سريعًا: أمره الله أن يضرب الأرض برجله، فنبعت عين ماء بارد يغتسل منه ويشرب. فشفاه الله، ورد عليه أهله ومثلهم معهم، رحمة من عنده وذكرى للعابدين.",
"ثم شهد الله له بكلمات لا تُنسى:",
{v:"v3844"},
"لم يُرفع البلاء لأن أيوب صرخ أكثر، بل لأن الله رحيم، والدعاء كان بابًا رقيقًا بين عبد وربه."
],end:"من صبر ولجأ إلى ربه وجد عنده أكثر مما فقد."},

{id:"musa-umm",title:"أم موسى.. وردّه إلى حضنها",sub:"قصة اليقين في وعد الله",min:5,body:[
"في زمن كان فرعون يذبّح فيه مواليد بني إسرائيل، وُلد موسى. خافت أمه خوفًا لا يعرفه إلا الأمهات، فجاءها وحي من ربها:",
{v:"v287"},
"فوضعته في صندوق وألقته في النهر وفي قلبها ما فيه. وساق الماء الصندوق إلى قصر فرعون، فالتقطه آل فرعون، وكانت امرأة فرعون تقول عنه إنه قرة عين لها ولزوجها.",
"وعن عناية الله بموسى يقول سبحانه إنه ألقى عليه محبة منه حتى تحبه القلوب:",
{v:"v2039"},
"وكان قلب أم موسى فارغًا من كل شيء إلا موسى، لكن الله ربط على قلبها. فأرسلت أخته تتبع أثره، ورفض الطفل كل المراضع، فدلّتهم أخته على أمٍّ ترضعه. فعاد الطفل إلى حضن أمه التي ألقته في النهر.",
{v:"v2813"},
"لم يطلب الله من الأم أن تفهم الخطة كلها، بل أن تثق. ثم جاء الوعد حقًّا، وعاد الطفل إلى حضنها، وصار نبيًّا."
],end:"من أطاع وهو خائف، أمّنه الله وردّ إليه ما أحبّ."},

{id:"musa-madyan",title:"موسى في مدين.. ربّ إني لما أنزلت إليّ من خير فقير",sub:"قصة الدعاء الذي فتح باب الفرج",min:4,body:[
"هرب موسى من مصر خائفًا، ووصل إلى مدين وحيدًا، لا مال معه ولا أهل ولا يعرف أحدًا. وعند الماء وجد قومًا يسقون مواشيهم، ووجد امرأتين تمنعان غنمهما وتنتظران.",
"سألهما عن شأنهما، فقالتا: أبونا شيخ كبير، ولا نسقي حتى ينصرف الرعاة. فسقى لهما، ثم ابتعد إلى ظل شجرة وهو متعب جائع غريب، ورفع يديه:",
{v:"v2824"},
"ولم يقل: أعطني كذا. قال إني فقير إلى ما تنزل إليّ من خير، فترك اختيار العطاء للكريم. وما لبث أن جاءته إحدى المرأتين تمشي على استحياء، تقول إن أبي يدعوك ليجزيك أجر ما سقيت لنا.",
"وهناك وجد موسى بيتًا وأمانًا وعملًا وأهلًا بعد أن كان لا يملك شيئًا. فمن دعاء قصير تحت ظل شجرة بدأ فصل جديد في حياته.",
"الطريق الذي بدأ بالخوف انتهى بالأمان، والدعاء الصغير تحت الظل فتح بابًا كبيرًا."
],end:"الدعاء الصادق، ولو كان كلمة واحدة، يطرق باب الكريم."},

{id:"maryam",title:"مريم.. وربكِ تحتكِ سريًّا",sub:"قصة الدعم الذي يأتي في أضعف اللحظات",min:5,body:[
"نشأت مريم في بيت عبادة، وكان الله قد رعاها منذ صغرها:",
{v:"v337"},
"وكفلها زكريا عليه السلام، فكان كلما دخل عليها المحراب وجد عندها رزقًا. فسألها: أنّى لكِ هذا؟ قالت: هو من عند الله، إن الله يرزق من يشاء بغير حساب.",
"ثم جاءها أمر عظيم، فقد بشّرتها الملائكة بغلام بلا أب. فخافت وانتبذت مكانًا بعيدًا، وجاءها المخاض إلى جذع نخلة، فقالت من شدة التعب والخوف: يا ليتني مت قبل هذا وكنت نسيًا منسيًا.",
"وفي أشد لحظات الوجع والخوف، سمعت صوتًا من تحتها:",
{v:"v1924"},
"ثم دلّها على الرزق وهي في تعب الولادة:",
{v:"v1925"},
"وأخبرها أن تأكل وتشرب وتقرّ عينًا، وإن رأت أحدًا فتقول إنها نذرت للرحمن صومًا فلن تكلم اليوم إنسيًّا. فلما جاءت قومها تحمله، قالوا لها ما قالوا، فأشارت إلى الطفل، فنطق وهو في المهد ودافع الله عنها بكلام لم يجرّبه بشر.",
"لم تدافع مريم عن نفسها بكلمة، لأن ربها تكفّل بالدفاع. وجاء الرزق في الوجع، وجاء السند من تحت قدميها."
],end:"من تحت أضعف لحظاتنا يخرج الله لنا ماءً وسنداً."},

{id:"asiya",title:"امرأة فرعون.. ربّ ابنِ لي عندك بيتًا",sub:"قصة القلب الذي سبق إلى الله",min:4,body:[
"امرأة فرعون كانت في أكبر قصر في الدنيا، وكانت زوجة أقوى حاكم في زمانها. ومع ذلك آمنت بالله وحدها في بيت كله كفر، ولم يكن حولها من يشجعها أو يشبهها.",
"ولم تطلب منصبًا ولا أمانًا من الدنيا، بل رفعت يديها بدعاء سجّله القرآن مثلًا لكل مؤمن:",
{v:"v6611"},
"قالت «عندك بيتًا» قبل أن تقول «نجّني». وقد لاحظ المفسرون أنها قدّمت الجوار قبل الدار، أي طلبت القرب من الله قبل أن تطلب النجاة. فكأن قلبها كان قد انتقل إلى جواره وهي بعد في القصر.",
"وشهد لها النبي ﷺ في الحديث الصحيح:",
{h:"كَمُلَ مِنَ الرِّجَالِ كَثِيرٌ، وَلَمْ يَكْمُلْ مِنَ النِّسَاءِ إِلَّا مَرْيَمُ بِنْتُ عِمْرَانَ وَآسِيَةُ امْرَأَةُ فِرْعَوْنَ",s:"رواه البخاري"},
"كان قصرها أكبر قصر في الأرض، لكن قلبها طلب بيتًا عند الله. ومن طلب ما عند الله أعطاه."
],end:"من سبق بقلبه إلى الله، لم يضره ما حوله."},

{id:"ibrahim",title:"إبراهيم.. يا نار كوني بردًا وسلامًا",sub:"قصة التوكل حين تنقطع الأسباب",min:4,body:[
"حطّم إبراهيم عليه السلام الأصنام وترك كبيرها. فلما سألوه قال: بل فعله كبيرهم هذا فاسألوهم إن كانوا ينطقون. فرجعوا إلى أنفسهم لحظة وقالوا: إنكم أنتم الظالمون، ثم غضبوا وقرروا أن يحرقوه.",
"جمعوا حطبًا كثيرًا وأوقدوا نارًا عظيمة، وألقوه فيها. وثبت في صحيح البخاري عن ابن عباس أن إبراهيم قال في تلك اللحظة:",
{h:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",s:"رواه البخاري عن ابن عباس"},
"فجاء الأمر من السماء، ولم يكن لأحد في الأرض ما يمنع:",
{v:"v2169"},
"وأراد القوم به كيدًا، فجعلهم الله الأخسرين.",
"حين لم يبقَ سبب في الأرض، تحرّك الأمر من السماء. والنار التي أرادوها نهاية صارت برداً وسلامًا."
],end:"حين تنقطع كل الأسباب، يبقى الله وحده، وهو يكفي."},

{id:"hajar",title:"هاجر.. إذن لا يضيّعنا",sub:"قصة اليقين قبل رؤية الجواب",min:6,body:[
"جاء إبراهيم عليه السلام بهاجر وابنها الرضيع إسماعيل إلى مكة، حيث لا زرع ولا ماء ولا أنيس. وضعهما عند شجرة، وترك عندهما جرابًا فيه تمر وسقاءً فيه ماء، ثم انصرف راجعًا. (رواه البخاري)",
"تبعته هاجر وقالت: يا إبراهيم، أين تذهب وتتركنا بهذا الوادي الذي ليس فيه إنس ولا شيء؟ وكرّرت ذلك مرارًا وهو لا يلتفت. ثم قالت:",
{h:"آللَّهُ الَّذِي أَمَرَكَ بِهَذَا؟ قَالَ: نَعَمْ. قَالَتْ: إِذَنْ لَا يُضَيِّعُنَا",s:"رواه البخاري"},
"ثم رجعت. ومضى إبراهيم حتى إذا غاب عنهما استقبل البيت ودعا ربه، ورفع يديه أن يجعل أفئدة من الناس تهوي إليهم ويرزقهم من الثمرات.",
"ونفد الماء، وجاع الصغير، وجعل يتلوّى. فلم تحتمل أمه أن تنظر إليه، فصعدت الصفا تنظر هل ترى أحدًا، فلم ترَ. ثم نزلت وسعت في الوادي حتى صعدت المروة، ففعلت ذلك سبع مرات. وقد قال النبي ﷺ: فذلك سعي الناس بينهما.",
"فلما كانت على المروة سمعت صوتًا، فتسمّعت، وقالت: قد أسمعتَ إن كان عندك غوث. فإذا هي بالملك عند موضع زمزم، فبحث بعقبه حتى ظهر الماء. فجعلت تحوّضه وتغرف من الماء في سقائها وهو يفور بعد ما تغرف. وقال النبي ﷺ: يرحم الله أم إسماعيل، لو تركت زمزم لكانت عينًا معينًا.",
"فشربت وأرضعت ولدها، وقال لها الملك: لا تخافوا الضيعة، فإن هاهنا بيت الله يبنيه هذا الغلام وأبوه، وإن الله لا يضيع أهله.",
"قالت: «إذن لا يضيّعنا» قبل أن ترى الماء. فكان يقينها قبل أن ترى. وكان جواب الله أكبر من سؤالها: بئر لا ينقطع، وبيت يقصده الناس إلى اليوم، وسعي يتكرر في كل حج وعمرة."
],end:"قالت إذن لا يضيّعنا، ثم رأت أن الله لا يضيّع."},

{id:"khadija",title:"خديجة.. كلا والله ما يخزيك الله أبدًا",sub:"قصة الكلمة التي ثبّتت قلبًا",min:5,body:[
"في غار حراء نزل الوحي لأول مرة على النبي ﷺ، فرجع إلى بيته يرجف فؤاده، وقال لخديجة رضي الله عنها: زمّلوني زمّلوني. فزمّلوه حتى ذهب عنه الروع. ثم حكى لها الخبر وقال: لقد خشيت على نفسي.",
"فقالت له كلمات صارت من أجمل ما قيل في طمأنة قلب:",
{h:"كَلَّا وَاللَّهِ مَا يُخْزِيكَ اللَّهُ أَبَدًا، إِنَّكَ لَتَصِلُ الرَّحِمَ، وَتَحْمِلُ الْكَلَّ، وَتَكْسِبُ الْمَعْدُومَ، وَتَقْرِي الضَّيْفَ، وَتُعِينُ عَلَى نَوَائِبِ الْحَقِّ",s:"رواه البخاري"},
"لم تكتفِ بالكلام، فذهبت به إلى ابن عمها ورقة بن نوفل، وكان قد عرف الكتب السابقة، فطمأنه وأخبره أن هذا هو الناموس الذي نزل على موسى.",
"ومرّت السنين، ورحلت خديجة عن الدنيا، وبقي أثرها في قلب النبي ﷺ حتى آخر عمره. وروى البخاري أن جبريل جاء النبي ﷺ فقال:",
{h:"هَذِهِ خَدِيجَةُ قَدْ أَتَتْكَ، فَاقْرَأْ عَلَيْهَا السَّلَامَ مِنْ رَبِّهَا وَمِنِّي، وَبَشِّرْهَا بِبَيْتٍ فِي الْجَنَّةِ مِنْ قَصَبٍ لَا صَخَبَ فِيهِ وَلَا نَصَبَ",s:"رواه البخاري"},
"امرأة واحدة، بحكمتها وحنانها، ثبّتت قلبًا في أصعب لحظة، فجاءها السلام من ربها نفسه."
],end:"الكلمة الطيبة في وقتها قد تكون سندًا لنبي."}
];
